plugins {
    id 'com.android.application'
}

android {
    namespace 'app.gwo.utils.imeswitchtile'
    compileSdk 35
    buildToolsVersion "35.0.0"

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    defaultConfig {
        applicationId 'app.gwo.utils.imeswitchtile'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}
