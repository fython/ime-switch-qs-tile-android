name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate preinstalled Android SDK
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install missing Android SDK packages
        shell: bash
        run: |
          missing=()
          for package in 'platforms;android-35' 'build-tools;35.0.0'; do
            directory="$ANDROID_HOME/${package//;/\/}"
            if [[ -f "$directory/package.xml" || -f "$directory/source.properties" ]]; then
              echo "Using installed SDK package: $package"
            else
              missing+=("$package")
            fi
          done
          if (( ${#missing[@]} )); then
            sdkmanager --sdk_root="$ANDROID_HOME" --install "${missing[@]}"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: input-method-switch-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
